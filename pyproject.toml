[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "source-adapter-fuzz"
version = "0.1.0"
description = "Zero-dependency conformance and fault-injection toolkit for public-data acquisition adapters"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Cascade" }]
keywords = ["testing", "fault-injection", "http", "public-data", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
source-adapter-fuzz = "source_adapter_fuzz.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.source-adapter-fuzz]
fixture-host = "127.0.0.1"
fixture-port = 8765
